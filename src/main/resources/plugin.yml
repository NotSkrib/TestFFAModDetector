name: TestFFAModDetector
version: '${project.version}'
main: xyz.nim.modDetectorPlugin.ModDetectorPlugin
api-version: '1.21.11'
# Folia refuses to load a plugin without this flag. Every scheduled task goes through Sched, which uses
# the entity/global schedulers (Paper API), so the same jar still runs on Paper, Purpur and Leaf.
folia-supported: true
author: TestFFA
description: TestFFAModDetector - channel-based + sign-probe mod/hack-client detection, + two-tier detect list.
# Legacy Bukkit plugin type deliberately, NOT paper-plugin.yml: Paper loads all
# paper-plugin.yml plugins in an earlier phase than all plugin.yml (legacy Bukkit)
# plugins, so a depend: on a legacy-Bukkit plugin (packetevents) from a Paper-type
# plugin can never be satisfied no matter what the name says. This plugin uses no
# Paper-only bootstrapper/loader classes, so staying legacy is safe.
depend: [packetevents]

commands:
  moddetector:
    description: TestFFAModDetector - status, manual checks, and reload.
    aliases: [md]
    usage: /moddetector <help|status|hacks|check|history|list|allow|disallow|detect|ignore|reload>
    permission: testffa.admin

permissions:
  testffa.admin:
    description: Use /moddetector admin subcommands.
    default: op
  testffa.alerts:
    description: Receive alerts when a player is detected.
    default: op
  testffa.bypass:
    description: Exempt this player from all detection.
    default: false
