# Special detection traps.
#
# These do NOT probe for a specific mod. They catch anti-detection tooling
# and cracked-client channel signatures. Because the false-positive risk
# is real (locale quirks, offline clients, weird brand strings) they ship
# WITHOUT punishments. Set `punish: true` only after you have observed
# the alerts on your own player base.

  # Vanilla trap: sends translation keys that a vanilla client always
  # resolves (item.minecraft.bone -> "Bone", "Knochen", ...). If the
  # response equals our fallback string, the client is running a
  # translation-response interceptor typical of anti-detection cheats.
  #
  # Ship as ALERT-ONLY. Only set punish: true after you have watched
  # the alerts and confirmed no legit clients false-flag.
  vanilla-trap:
    display-name: "Translation Interceptor"
    category: CHEAT
    signals:
      - source: TRANSLATE
        keys: ["item.minecraft.bone", "item.minecraft.diamond", "gameMode.survival",
               "item.minecraft.stick", "item.minecraft.arrow", "block.minecraft.stone",
               "block.minecraft.dirt", "entity.minecraft.zombie", "entity.minecraft.pig",
               "gameMode.creative", "gameMode.spectator"]
        required: true
    punish: true

  # Cracked / leaked-client channel signatures. Strong signals only:
  # each pattern is a fully-anchored unique magic-string used by a
  # specific cracked build. Ships with kick since a match is very high
  # confidence.
  cracked-clients:
    display-name: "Cracked/Leaked Client"
    category: CHEAT
    signals:
      - source: CHANNEL
        matches:
          - "^CPS_BAN_THIS"
          - "^L0LIMAHCKER$"
          - "^LOLIMAHCKER$"
          - "^EROUAXWASHERE$"
          - "^EARWAXWASHERE$"
          - "^#unbanearwax$"
          - "^194620356vv0$"
          - "^mincraftpvphcker$"
          - "^0SO1Lk2KASxzsd$"
          - "^0SSxzsd$"
          - "^CB\\|INIT$"
          - "^CB-Binary$"
          - "^CRYSTAL\\|"
          - "^Parrot$"
          - "^Skill$"
          - "^PoisonHQ$"
          - "^Synergy$"
          - "^WDL\\|INIT$"
          - "^wdl:init$"
          - "^PERMISSIONSREPL$"
    punish: false
    punishments:
      - "kick %player% &cUse of a disallowed client is forbidden. Detected: %punishable%"

# UTILITY category mods.
#
# Category colour: grey. Legit quality-of-life or performance mods. Passive
# detection only (BRAND / CHANNEL), no active sign probes for these, no
# commands. Purely informational so admins know the client fleet.

  sodium:
    display-name: "Sodium"
    category: UTILITY
    signals:
      - source: CHANNEL
        matches: ["^sodium:"]
