# LAUNCHER category mods.
#
# Category colour: main blue. Alternative Minecraft clients / launchers.
# These are not cheats but you may want to know who uses them (e.g. for
# support routing or telemetry). Default is log + alert only.

  lunar:
    display-name: "Lunar Client"
    category: LAUNCHER
    signals:
      - source: BRAND
        matches: ["(?i)^lunar"]
    punish: false

  badlion:
    display-name: "Badlion Client"
    category: LAUNCHER
    signals:
      - source: BRAND
        matches: ["(?i)^badlion", "^BLC"]
    punish: false

  feather:
    display-name: "Feather Client"
    category: LAUNCHER
    signals:
      - source: BRAND
        matches: ["(?i)^feather"]
    punish: false

  salwyrr:
