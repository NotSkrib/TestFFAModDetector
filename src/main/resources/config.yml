# Add your own channel/brand mods here without editing the mods: catalog below, e.g.:
# custom-mods:
#   my-mod:
#     name: "My Mod"
#     punish: true
#     channels: ["mymod:*"]
#     brand: ["(?i)^mylauncher"]
custom-mods: {}

# ============================================================
#  Sign-probe hack-client detection (needs PacketEvents)
# ============================================================
hack-checks:
  # If false, detections are only logged/alerted - nothing ever gets kicked.
  kick: true
  # <punishable> = only the mods that actually triggered this (excludes benign
  # punish: false detections riding along, e.g. a minimap seen on the same player).
  # <detected> = everything found, <hacks> = sign-probe hits only, <mods> = channel/brand hits only.
  kick-message: "&cUnauthorized modifications detected: <punishable>"

  # Fallback console commands for any punish: true mod that has no punishments: list
  # of its own (same %player%/%punishable%/%detected%/%mods%/%hacks% placeholders as
  # a per-mod punishments: entry). Only used when that mod's own entry has none - the
  # kick-message above is still the final fallback if this is also empty.
  default-punishments: []

  # Ticks after join before the tier-1 passive (channel/brand) scan runs. 0 = next tick.
  passive-delay-ticks: 5

  # How long a single sign batch waits for the client's reply before giving up on it. A
  # batch that times out contributes NO detections - a client that never answers is not
  # evidence of anything, so this is not an escalation trigger either.
  timeout-ticks: 40

  # Delay between sign batches. Raise it if a large catalogue makes the probe burst
  # noticeable to players; 0 sends batches back to back.
  between-batch-ticks: 0

  # Definitions packed onto one fake sign, and how many go on one of its 4 lines.
  # Batching at 80/sign (20/line) is what this plugin has always shipped. Packing more
  # blows past the real ~384-char protocol cap per line (real key strings run 40-60
  # chars); anything past that point is silently truncated by the safe reader in
  # HackCheckPacketListener and reads back as "detected" for every player, hack or not.
  # 20/line is the safe maximum - raising either value re-arms that failure mode.
  batch-size: 80
  keys-per-line: 20

  # Escalation. true = a tier-1 hit (sign probe or passive) immediately runs a second
  # pass over the mods NOT in the detect: list, so one report names everything the
  # client is actually running instead of just the first thing that tripped. Those
  # extra definitions are disjoint from tier 1's, so nothing is probed twice.
  # false = tier 1 only: faster for a detected player, but the report names only ticked
  # mods. This one flag is both the escalation switch and the speed/completeness switch.
  escalate: true

  # Floodgate/Bedrock clients can't answer a sign probe, so skip them entirely - on both
  # the passive scan and the active probe, not just the active one.
  skip-bedrock: true
  bedrock-name-prefix: "."

  on-join:
    enabled: true
    delay-ticks: 20
    only-first-join: false

  # Verbose logging: every probe key sent and every raw line the client sent back. Leave off
  # unless you're actively troubleshooting why something isn't (or shouldn't be) detected.
  sign-probe-debug: false

# ============================================================
#  Custom sign-probe hack definitions, on top of the TRANSLATE/KEYBIND/METEOR_VARIANT
#  signals already declared per-mod in the mods: catalog below. Only needed for a probe
#  key you want to add without editing that mod's own entry. See ADDING-MODS.md.
#
#  Schema: one entry per (mod, key) pair.
#    <id>:
#      display-name: "Display Name"
#      key: "some.translation.or.keybind.key"
#      mode: TRANSLATE | KEYBIND | METEOR
#      punish: true
# ============================================================
hacks: {}

# ============================================================
#  Mod database: channel/brand passive detection + sign-probe signals for every known
#  mod. This is the signal database the detect: list above indexes into - being listed
#  here does NOT mean a mod is probed on join, only that it CAN be. Tick it above.
# ============================================================
mods:

