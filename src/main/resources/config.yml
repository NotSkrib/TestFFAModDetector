# ============================================================
#  TestFFAModDetector configuration
# ============================================================

# Tell staff (testffa.alerts) in chat whenever anyone is detected, passive or sign-probe.
alert-staff: true
detection-log:
  enabled: false
  file: "detections.jsonl"

# Channel/brand passive detection (see the mods: catalog below). blacklist = everything
# loaded counts except blocked-mods; whitelist = only ids listed in blocked-mods count.
mode: blacklist
blocked-mods: []

# Add your own channel/brand mods here without editing the mods: catalog below, e.g.:
# custom-mods:
#   my-mod:
#     name: "My Mod"
#     punish: true
#     channels: ["mymod:*"]
#     brand: ["(?i)^mylauncher"]
custom-mods: {}

# ============================================================
#  Sign-probe hack-client detection (needs PacketEvents)
# ============================================================
hack-checks:
  # If false, detections are only logged/alerted - nothing ever gets kicked.
  kick: true
  # <punishable> = only the mods that actually triggered this (excludes benign
  # punish: false detections riding along, e.g. a minimap seen on the same player).
  # <detected> = everything found, <hacks> = sign-probe hits only, <mods> = channel/brand hits only.
  kick-message: "&cUnauthorized modifications detected: <punishable>"

  # Fallback console commands for any punish: true mod that has no punishments: list
  # of its own (same %player%/%punishable%/%detected%/%mods%/%hacks% placeholders as
  # a per-mod punishments: entry). Only used when that mod's own entry has none - the
  # kick-message above is still the final fallback if this is also empty.
  default-punishments: []

  on-join:
    enabled: true
    delay-ticks: 20
    only-first-join: false

  # Verbose logging: every probe key sent and every raw line the client sent back. Leave off
  # unless you're actively troubleshooting why something isn't (or shouldn't be) detected.
  sign-probe-debug: false

# ============================================================
#  Custom sign-probe hack definitions, on top of the TRANSLATE/KEYBIND/METEOR_VARIANT
#  signals already declared per-mod in the mods: catalog below. Only needed for a probe
#  key you want to add without editing that mod's own entry. See ADDING-MODS.md.
#
#  Schema: one entry per (mod, key) pair.
#    <id>:
#      display-name: "Display Name"
#      key: "some.translation.or.keybind.key"
#      mode: TRANSLATE | KEYBIND | METEOR
#      punish: true
# ============================================================
hacks: {}

# ============================================================
#  Mod database: channel/brand passive detection + sign-probe signals for every known
#  mod. blacklist mode (default above) tracks everything here except blocked-mods.
# ============================================================
mods:

