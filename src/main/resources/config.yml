        matches: ["(?i)^labymod"]
    punish: false

# SUSPICIOUS category mods.
#
# Category colour: gold. Dual-use tools often paired with cheats but with
# legitimate uses too. Default is log + alert only, no auto-kick.
# Add punish: true per entry if you want to punish for a specific mod.

  # Another brand-string anomaly heuristic (see the vanilla-spoof/geyser-spoof
  # entries above) - a real client always reports something, so an empty or missing
  # brand is itself suspicious rather than a specific mod's signature.
