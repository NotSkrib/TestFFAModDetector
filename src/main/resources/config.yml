  # Brand-string anomaly heuristics - unlike every other entry here these don't match a
  # specific mod's known signature, they catch a contradiction in what the client itself
  # reports, so they can flag mods this catalog has never heard of. Ported from the
  # original ModDetector jar's built-in checks (see NOTICE.md).
  vanilla-spoof:
    display-name: "Spoofed Vanilla Brand"
    category: CHEAT
    signals:
      - source: VANILLA_SPOOF
    punish: true
    punishments:
      - "kick %player% &cUse of a disallowed client is forbidden. Detected: %punishable%"

  geyser-spoof:
    display-name: "Spoofed Geyser Brand"
    category: CHEAT
    signals:
      - source: GEYSER_SPOOF
    punish: true
    punishments:
      - "kick %player% &cUse of a disallowed client is forbidden. Detected: %punishable%"

# LAUNCHER category mods.
#
# Category colour: main blue. Alternative Minecraft clients / launchers.
# These are not cheats but you may want to know who uses them (e.g. for
# support routing or telemetry). Default is log + alert only.

  lunar:
    display-name: "Lunar Client"
    category: LAUNCHER
    signals:
      - source: BRAND
        matches: ["(?i)^lunar"]
    punish: false

  badlion:
    display-name: "Badlion Client"
    category: LAUNCHER
    signals:
      - source: BRAND
        matches: ["(?i)^badlion", "^BLC"]
    punish: false

  feather:
    display-name: "Feather Client"
    category: LAUNCHER
    signals:
      - source: BRAND
        matches: ["(?i)^feather"]
    punish: false

  salwyrr:
    display-name: "Salwyrr Client"
    category: LAUNCHER
    signals:
      - source: BRAND
        matches: ["(?i)^salwyrr"]
    punish: false

  prismlauncher:
    display-name: "Prism / PolyMC"
    category: LAUNCHER
    signals:
      - source: BRAND
        matches: ["(?i)^prismlauncher", "(?i)^polymc"]
    punish: false

  geyser:
    display-name: "Bedrock (Geyser)"
    category: LAUNCHER
    signals:
      - source: BRAND
        matches: ["^Geyser"]
    punish: false

  labymod:
    display-name: "LabyMod"
    category: LAUNCHER
    signals:
      - source: BRAND
        matches: ["(?i)^labymod"]
    punish: false

# SUSPICIOUS category mods.
