# ============================================================
#  TestFFAModDetector configuration
# ============================================================

# Tell staff (testffa.alerts) in chat whenever anyone is detected, passive or sign-probe.
alert-staff: true
detection-log:
  enabled: false
  file: "detections.jsonl"

# ------------------------------------------------------------
#  Chat signing
# ------------------------------------------------------------
#  Catches clients that strip chat signatures. This is the one signal that
#  survives a client which otherwise looks exactly like vanilla: a signed
#  message is not a channel, a brand or a translation key, so hiding it means
#  deliberately suppressing the chat protocol. OpSec (Signing Mode: OFF) and
#  No Chat Reports both do this.
#
#  Fires once a player has sent 5 consecutive UNSIGNED messages.
#
#  OFF by default, and ships alert-only even when on, because unsigned chat has
#  innocent causes: a server without enforce-secure-profile, a player who turned
#  chat signing off in their own account settings, or a client too old to sign.
#  Turn on `punish` only after watching the alerts on your own player base.
chat-signing:
  enabled: false
  punish: false

# ============================================================
#  What gets detected - the tick-off list
# ============================================================
#  Every mod id you list here is a mod this plugin looks for.
#  Untick a mod = delete its line.  Tick a mod = add the line.
#
#  Two tiers:
#    TIER 1 (this list)  - probed on every join. This is the fast path.
#    TIER 2 (everything) - probed ONLY after tier 1 hits something, so a detection
#                          report tells you what the client is ACTUALLY running
#                          instead of just the first thing that tripped.
#  Turn tier 2 off entirely with hack-checks.escalate: false further down.
#
#  Note the punish axis is separate: allow/disallow (or punish: in the mods:
#  catalog below) decides whether a detection kicks. A ticked mod with
#  punish: false is still reported, just not enforced.
#
#  Structural requirement: keep the key at column 0 and the items as indented
#  "- item" lines directly beneath it. /moddetector detect and
#  /moddetector ignore edit this block in place - if the shape changes, those
#  commands report that they could not find the list. See ADDING-MODS.md.
#
#  Shipped default: every mod in the catalog that ships `punish: true`, sorted
#  alphabetically, EXCEPT vanilla-spoof and geyser-spoof. Those two signal
#  through VANILLA_SPOOF / GEYSER_SPOOF, neither of which ModCatalog.SignalSource
#  knows, so they are no-ops today (see ADDING-MODS.md). That is 74 - 2 = 72
#  ids: only the mods this plugin can actually act on. The third brand-anomaly
#  entry, no-brand, ships punish: false so it never qualified to begin with - it
#  is inert for the same reason, via NO_BRAND; ADDING-MODS.md covers all three.
#  Add the informational ones from the reference block below (utilities,
#  launchers, QoL mods) if you want them reported in tier 1 too; they are still
#  covered by tier 2 on a detection.
