    category: LAUNCHER
    signals:
      - source: BRAND
        matches: ["(?i)^prismlauncher", "(?i)^polymc"]
    punish: false

  geyser:
    display-name: "Bedrock (Geyser)"
    category: LAUNCHER
    signals:
      - source: BRAND
        matches: ["^Geyser"]
    punish: false

  labymod:
